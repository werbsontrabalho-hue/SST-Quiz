<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="8" />

  <!-- Shield -->
  <path d="M 256,100 L 376,144 C 376,272 320,368 256,412 C 192,368 136,272 136,144 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)" />

  <!-- Inner Cross / Safety Symbol -->
  <path d="M 232,192 H 280 V 232 H 320 V 280 H 280 V 320 H 232 V 280 H 192 V 232 H 232 Z" 
        fill="#ffffff" />
  
  <!-- Star / Lightning Accent -->
  <path d="M 256,120 L 264,136 L 282,138 L 268,150 L 272,168 L 256,158 L 240,168 L 244,150 L 230,138 L 248,136 Z" 
        fill="#f59e0b" />
</svg>
